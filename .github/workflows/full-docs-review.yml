name: Finalize documentation quality

on:
  push:
    paths:
      - .github/workflows/full-docs-review.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: 53c00f88432d97ea629cda8f0b0ffe622e80ad6f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53c00f88432d97ea629cda8f0b0ffe622e80ad6f
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json

      - name: Apply the audit findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} matches, found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          def append_once(path: str, marker: str, block: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  raise RuntimeError(f"{path}: block already present: {marker}")
              file.write_text(text.rstrip() + "\n\n" + block.strip() + "\n")

          # Semantic theme tokens and readable button variants.
          replace(
              "registry/src/data/theme.ts",
              '      destructive: "oklch(63.68% 0.2078 25.33)",\n      border:',
              '      destructive: "oklch(63.68% 0.2078 25.33)",\n      "destructive-foreground": "oklch(0% 0 0)",\n      border:',
              expected=2,
          )
          replace(
              "registry/src/data/theme.ts",
              '      "color-destructive": "var(--destructive)",\n      "color-border":',
              '      "color-destructive": "var(--destructive)",\n      "color-destructive-foreground": "var(--destructive-foreground)",\n      "color-border":',
          )
          replace(
              "registry/src/components/ui/button-variants.ts",
              'destructive: `bg-destructive text-white border-2 border-border ${raisedPress}`',
              'destructive: `bg-destructive text-destructive-foreground border-2 border-border ${raisedPress}`',
          )
          replace(
              "registry/src/components/ui/button-variants.ts",
              'link: "text-primary underline-offset-4 hover:underline"',
              'link: "text-foreground underline-offset-4 hover:underline"',
          )

          # Component-level audit fixes.
          replace(
              "registry/src/components/ui/calendar.tsx",
              '"text-main-foreground opacity-50 aria-selected:text-main-foreground",',
              '"text-main-foreground opacity-70 aria-selected:text-main-foreground aria-selected:opacity-100",',
          )
          replace(
              "registry/src/components/ui/sidebar.tsx",
              'absolute top-1.5 right-1 flex aspect-square w-5 items-center',
              'absolute top-1.5 right-1 flex aspect-square w-6 items-center',
          )
          replace(
              "registry/src/components/ui/table.tsx",
              '<div data-slot="table-container" className="relative w-full overflow-auto">',
              '<div\n      data-slot="table-container"\n      className="relative w-full overflow-auto focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"\n      tabIndex={0}\n    >',
          )

          # Every horizontally scrollable documentation surface is keyboard reachable.
          replace(
              "docs/app/components/installation.tsx",
              "          <code>{command}</code>",
              "          <code tabIndex={0}>{command}</code>",
          )
          replace(
              "docs/app/components/mdx-components.tsx",
              '    <div className="md-table-shell">',
              '    <div className="md-table-shell" tabIndex={0}>',
          )
          replace(
              "docs/src/components/docs/pre.tsx",
              "      <pre className={className} {...props}>",
              "      <pre tabIndex={0} className={className} {...props}>",
          )
          append_once(
              "docs/app/styles/content.css",
              ".installation-tabs__command code:focus-visible",
              '''
              .docs-code pre:focus-visible,
              .installation-tabs__command code:focus-visible {
                outline: 2px solid #f1f5f9;
                outline-offset: -4px;
              }

              .md-table-shell:focus-visible {
                outline: 2px solid var(--ring);
                outline-offset: 3px;
              }
              ''',
          )

          # The special-page kicker sits on the palette main color, not the page background.
          append_once(
              "docs/app/styles/shell.css",
              ".special-page-header .docs-page-kicker",
              '''
              .special-page-header .docs-page-kicker,
              .special-page-header .docs-page-kicker span {
                color: var(--main-foreground);
              }
              ''',
          )

          # Live examples expose explicit names instead of relying on placeholder rendering.
          replace(
              "docs/src/examples/ui/combobox/users.tsx",
              '          role="combobox"\n          aria-expanded={open}',
              '          role="combobox"\n          aria-label="Select a user"\n          aria-expanded={open}',
          )
          replace(
              "docs/src/examples/ui/combobox/multiselect.tsx",
              '          role="combobox"\n          aria-expanded={open}',
              '          role="combobox"\n          aria-label="Select frameworks"\n          aria-expanded={open}',
          )
          replace(
              "docs/src/examples/ui/combobox/timezones.tsx",
              '        <Button variant="noShadow" className="h-12 w-full justify-between px-2.5 md:max-w-[200px]">',
              '        <Button\n          variant="noShadow"\n          role="combobox"\n          aria-label="Select a timezone"\n          aria-expanded={open}\n          className="h-12 w-full justify-between px-2.5 md:max-w-[200px]"\n        >',
          )
          replace(
              "docs/src/examples/ui/progress.tsx",
              '  return <Progress value={progress} className="w-[60%]" />;',
              '  return <Progress value={progress} className="w-[60%]" aria-label="Loading progress" />;',
          )
          replace(
              "docs/src/examples/ui/select/index.tsx",
              '<SelectTrigger id="publication-status">',
              '<SelectTrigger id="publication-status" aria-label="Publication status">',
          )
          replace(
              "docs/src/examples/ui/select/disabled.tsx",
              '<SelectTrigger className="w-[180px]">',
              '<SelectTrigger className="w-[180px]" aria-label="Disabled fruit selection">',
          )
          replace(
              "docs/src/examples/ui/select/large-list.tsx",
              '<SelectTrigger className="w-[180px]">',
              '<SelectTrigger className="w-[180px]" aria-label="Select an item">',
          )
          replace(
              "docs/src/examples/ui/select/with-icon.tsx",
              '<SelectTrigger className="w-[180px]">',
              '<SelectTrigger className="w-[180px]" aria-label="Chart type">',
          )

          # Keep the full audit in CI without writing hundreds of successful screenshots.
          replace(
              "docs/tests/accessibility.spec.ts",
              '    await page.evaluate(() => scrollTo(0, 0));\n    await page.screenshot({ path: info.outputPath("viewport.png"), animations: "disabled" });\n    await page.locator("main").first().screenshot({ path: info.outputPath("content.png"), animations: "disabled" });\n',
              "",
          )

          # The complete browser suite now includes all routes and axe scans.
          replace(".github/workflows/ci.yml", "    timeout-minutes: 20", "    timeout-minutes: 35")
          replace(".github/workflows/ci.yml", "    timeout-minutes: 15", "    timeout-minutes: 30")
          PY

      - name: Install dependencies
        run: |
          npm ci --prefix registry --no-fund
          npm ci --prefix docs --no-fund

      - name: Build and verify the registry and documentation
        run: |
          npm audit --prefix registry --audit-level=high
          npm run lint --prefix registry
          npm run typecheck --prefix registry
          npm run build --prefix registry
          npm run registry:validate --prefix registry
          npm run registry:check --prefix registry
          npm audit --prefix docs --audit-level=high
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm test --prefix docs

      - name: Validate the namespace with the current upstream validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, urllib.request

          root = Path.cwd()
          target = Path("/tmp/shadcn-registry-validation")
          target.mkdir()
          upstream = subprocess.check_output(
              ["gh", "api", "repos/shadcn-ui/ui/commits/main", "--jq", ".sha"], text=True
          ).strip()
          for relative in [
              "registry/directory.json",
              "lib/registry-directory.ts",
              "scripts/validate-registries.mts",
          ]:
              path = target / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              url = f"https://raw.githubusercontent.com/shadcn-ui/ui/{upstream}/apps/v4/{relative}"
              with urllib.request.urlopen(url) as response:
                  path.write_bytes(response.read())

          entry = json.loads((root / "registry/directory-entry.json").read_text())
          directory = json.loads((target / "registry/directory.json").read_text())
          if any(item["name"].lower() == entry["name"].lower() for item in directory):
              raise RuntimeError(f"Namespace is already registered: {entry['name']}")
          directory.append(entry)
          directory.sort(key=lambda item: item["name"].lower())
          (target / "registry/directory.json").write_text(json.dumps(directory, indent=2) + "\n")
          (target / "node_modules").symlink_to(root / "registry/node_modules", target_is_directory=True)
          (target / "package.json").write_text(
              json.dumps(
                  {
                      "private": True,
                      "type": "module",
                      "scripts": {
                          "validate:registries": "tsx --tsconfig ./tsconfig.scripts.json ./scripts/validate-registries.mts"
                      },
                  }
              )
          )
          (target / "tsconfig.scripts.json").write_text(
              json.dumps(
                  {
                      "compilerOptions": {
                          "target": "ES2022",
                          "module": "NodeNext",
                          "moduleResolution": "NodeNext",
                          "skipLibCheck": True,
                      }
                  }
              )
          )
          subprocess.run(["npm", "run", "validate:registries"], cwd=target, check=True)
          print(f"Validated @neobrutal-ui against shadcn-ui/ui {upstream}")
          PY

      - name: Verify fresh consumers
        run: |
          npm run consumer:verify --prefix registry
          npm run consumer:verify --prefix registry -- vite --item=button
          npm run consumer:verify --prefix registry -- vite --item=calendar
          npm run consumer:verify --prefix registry -- next --item=dialog
          npm run consumer:verify --prefix registry -- next --item=blog-template

      - name: Run the whole-site interaction and accessibility review
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Publish the validated tree to main
        run: |
          git add -A
          git diff --cached --check
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; refusing to overwrite unrelated work."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'docs: complete the whole-site quality and accessibility pass' | git commit-tree "$tree" -p "$GITHUB_SHA")"
          git push origin "$commit:refs/heads/main"
          echo "Published $commit"
