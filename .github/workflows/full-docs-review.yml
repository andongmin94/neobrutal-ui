name: Full documentation review
on:
  push:
    paths:
      - .github/workflows/full-docs-review.yml
permissions:
  contents: read
  actions: read
jobs:
  findings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-documentation-review
          run-id: 34964540904
          github-token: ${{ github.token }}
          path: /tmp/baseline
      - name: Summarize accessibility findings
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          text = Path('/tmp/baseline/tmp/browser-results.log').read_text()
          data = json.loads(text[text.index('\n{\n  "config"') + 1:])
          scans, failures = [], []
          def walk(suites):
              for suite in suites:
                  walk(suite.get('suites', []))
                  for spec in suite.get('specs', []):
                      for test in spec['tests']:
                          for result in test.get('results', []):
                              if result['status'] != 'passed':
                                  failures.append({'test': spec['title'], 'profile': test['projectName'], 'error': result.get('error', {}).get('message', '')})
                              for attachment in result.get('attachments', []):
                                  if attachment['name'] == 'accessibility' and 'body' in attachment:
                                      scans.append(json.loads(base64.b64decode(attachment['body'])))
          walk(data['suites'])
          unique = {}
          for scan in scans:
              for violation in scan['violations']:
                  for node in violation['nodes']:
                      key = (violation['id'], node['html'], node.get('failureSummary', ''))
                      row = unique.setdefault(key, {'rule': violation['id'], 'html': node['html'], 'summary': node.get('failureSummary', ''), 'routes': set(), 'profiles': set()})
                      row['routes'].add(scan['route'])
                      row['profiles'].add(scan['profile'])
          rows = [{**v, 'routes': sorted(v['routes']), 'profiles': sorted(v['profiles'])} for v in unique.values()]
          summary = {'candidate': '53c00f88432d97ea629cda8f0b0ffe622e80ad6f', 'stats': data['stats'], 'scans': len(scans), 'findings': rows, 'failures': failures}
          Path('/tmp/findings.json').write_text(json.dumps(summary, indent=2))
          print('STATS', json.dumps(data['stats']), 'SCANS', len(scans), 'FINDINGS', len(rows))
          for row in rows:
              print('FINDING', json.dumps(row))
          for failure in failures:
              if 'accessibility' not in failure['test']:
                  print('OTHER FAILURE', json.dumps(failure))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quality-findings
          retention-days: 7
          path: /tmp/findings.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-screenshots
          retention-days: 7
          path: /tmp/baseline/home/runner/work/neobrutal-ui/neobrutal-ui/docs/test-results/**/*.png
