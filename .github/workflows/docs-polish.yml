name: Validate docs polish

on:
  push:
    branches: [main]
    paths: [.github/workflows/docs-polish.yml]

permissions:
  contents: read

concurrency:
  group: docs-polish
  cancel-in-progress: true

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Apply reviewed candidate
        run: |
          python3 .github/polish-docs.py
          python3 .github/polish-docs-content.py
          python3 .github/polish-theme-css.py
      - name: Build the candidate
        run: |
          npm ci --prefix registry --no-audit --no-fund > /tmp/install-registry.log 2>&1
          npm install --prefix docs --no-audit --no-fund > /tmp/install-docs.log 2>&1
          npm run lint --prefix registry
          npm run build --prefix registry > /tmp/registry-build.log 2>&1 || { tail -n 60 /tmp/registry-build.log; exit 1; }
          npm run build --prefix docs > /tmp/docs-build.log 2>&1 || { tail -n 60 /tmp/docs-build.log; exit 1; }
          cd docs
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -n 60 /tmp/browser-install.log; exit 1; }
      - name: Compare pointer and touch geometry on mobile
        working-directory: docs
        run: |
          cat > tests/mobile-diagnostic.spec.ts <<'JS'
          import { test, expect } from '@playwright/test';
          for (const mode of ['click', 'tap', 'blur', 'font16']) {
            test(mode, async ({ page }, info) => {
              await page.goto('/');
              if (mode === 'font16') await page.addStyleTag({ content: 'input, select, textarea { font-size: 16px !important; }' });
              await page.getByLabel('Workspace name', { exact: true }).fill('Docs review');
              await page.getByRole('button', { name: 'Save workspace' }).click();
              await page.getByRole('searchbox', { name: 'Search component directory' }).fill('calendar');
              await expect(page).toHaveURL(/q=calendar/);
              if (mode === 'blur') await page.getByRole('searchbox', { name: 'Search component directory' }).blur();
              const card = page.locator('.directory-card').filter({ has: page.getByRole('heading', { name: 'Calendar', exact: true }) });
              await card.scrollIntoViewIfNeeded();
              const cdp = await page.context().newCDPSession(page);
              console.log('METRICS', mode, JSON.stringify(await cdp.send('Page.getLayoutMetrics')));
              console.log('DOM', mode, JSON.stringify(await card.evaluate(node => {
                const r = node.getBoundingClientRect();
                const center = { x: r.x + r.width / 2, y: r.y + r.height / 2 };
                const rect = (el) => el?.getBoundingClientRect().toJSON();
                const hit = document.elementFromPoint(center.x, center.y);
                return {
                  card: r.toJSON(), center, hit: hit?.outerHTML.slice(0, 300), scrollY, innerWidth, innerHeight,
                  visual: visualViewport ? { offsetTop: visualViewport.offsetTop, pageTop: visualViewport.pageTop, height: visualViewport.height, scale: visualViewport.scale } : null,
                  html: rect(document.documentElement), body: rect(document.body), hero: rect(document.querySelector('.directory-hero')),
                  active: document.activeElement?.outerHTML.slice(0, 200),
                  ancestors: Array.from((function*(){ let p=node; while(p) {yield p; p=p.parentElement;} })()).map(el => ({ tag:el.tagName, class:el.className, rect:rect(el), pointer:getComputedStyle(el).pointerEvents, transform:getComputedStyle(el).transform, overflow:getComputedStyle(el).overflow }))
                };
              })));
              try {
                if (mode === 'tap') await card.tap({ timeout: 3000 });
                else await card.click({ timeout: 3000 });
                await expect(page).toHaveURL(/\/docs\/calendar/);
                console.log('RESULT', mode, 'passed');
              } catch (error) {
                console.log('RESULT', mode, 'failed', String(error).slice(0, 3500));
              }
              await page.screenshot({ path: info.outputPath(`${mode}.png`) });
            });
          }
          JS
          npm run test:browser -- tests/mobile-diagnostic.spec.ts --project=mobile-light --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-mobile-diagnostic
          retention-days: 3
          path: |
            docs/test-results
            docs/playwright-report
