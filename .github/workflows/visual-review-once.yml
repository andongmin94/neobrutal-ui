name: Finalize verified visual review

on:
  push:
    branches: [main]
    paths: [.github/workflows/visual-review-once.yml]

permissions:
  contents: write

concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEWED_COMMIT: 8a73d1c31cb28dace04707ec860779c5990f6b72
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Restore the exact source that passed 210 Chromium and 18 cross-browser tests
        run: |
          set -eu
          test "$(git ls-remote --heads origin | cut -f2)" = refs/heads/main
          git fetch origin "$REVIEWED_COMMIT"
          test "$(git rev-parse "$REVIEWED_COMMIT^")" = fd187ccbb8e729f56d34cb5627f66ff8e0abf230
          git restore --source="$REVIEWED_COMMIT" --staged --worktree -- registry docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install dependencies and capture browser
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          cd docs
          npx playwright install --with-deps chromium
      - name: Verify the unchanged installable source
        run: |
          npm run format --prefix registry
          npm run lint --prefix registry
          npm run typecheck --prefix registry
          npm run build --prefix registry
          npm run registry:validate --prefix registry
          npm run registry:check --prefix registry
      - name: Build the reviewed documentation
        run: npm run build --prefix docs > "$RUNNER_TEMP/build-before.log" 2>&1 || { tail -100 "$RUNNER_TEMP/build-before.log"; exit 1; }
      - name: Capture the CMS without the surrounding documentation header
        working-directory: docs
        timeout-minutes: 3
        run: |
          cat > .capture-cms.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import { chromium, expect } from "@playwright/test";
          const evidence=path.join(process.env.RUNNER_TEMP,"final-review");
          fs.mkdirSync(evidence,{recursive:true});
          const browser=await chromium.launch();
          try {
            const page=await browser.newPage({viewport:{width:1280,height:720},colorScheme:"light",reducedMotion:"reduce"});
            page.setDefaultTimeout(15000);
            await page.addInitScript(()=>localStorage.setItem("neobrutal-ui-theme","light"));
            const errors=[];
            page.on("pageerror",error=>errors.push(error.message));
            const response=await page.goto("http://127.0.0.1:4173/templates/cms");
            expect(response.ok()).toBe(true);
            await expect(page.locator("html")).toHaveAttribute("data-hydrated","true");
            await expect(page.locator(".special-page-loading")).toHaveCount(0);
            await page.evaluate(()=>document.fonts.ready);
            await expect(page.locator("[data-site-navbar]")).toHaveCount(1);
            // Only the documentation shell is hidden; the installed template stays unchanged.
            await page.addStyleTag({content:"[data-site-navbar] { display: none !important; }"});
            await page.evaluate(()=>scrollTo(0,0));
            const template=page.locator(".special-content > div");
            await expect(template).toHaveCount(1);
            const bounds=await template.boundingBox();
            expect(bounds).toEqual({x:0,y:0,width:1280,height:720});
            const image=await template.screenshot({animations:"disabled",caret:"hide",timeout:15000});
            expect(image.readUInt32BE(16)).toBe(1280);
            expect(image.readUInt32BE(20)).toBe(720);
            expect(errors).toEqual([]);
            const name=`cms-${crypto.createHash("sha256").update(image).digest("hex").slice(0,10)}.png`;
            const old="cms-02b120f502.png";
            const data=fs.readFileSync("src/data/templates.ts","utf8");
            expect(data.split(old)).toHaveLength(2);
            expect(name).not.toBe(old);
            fs.writeFileSync(`public/template-previews/${name}`,image);
            fs.writeFileSync("src/data/templates.ts",data.replace(old,name));
            fs.unlinkSync(`public/template-previews/${old}`);
            fs.writeFileSync(path.join(evidence,"cms-thumbnail.png"),image);
            fs.writeFileSync(path.join(evidence,"capture.json"),JSON.stringify({name,bounds,errors,reviewedCommit:process.env.REVIEWED_COMMIT},null,2));
          } finally { await browser.close(); }
          JS
          node node_modules/vite/bin/vite.js preview --outDir build/client --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/capture-server.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$pid"
            if curl --fail --silent http://127.0.0.1:4173/templates/cms >/dev/null; then break; fi
            sleep 1
          done
          timeout --signal=TERM 90s node .capture-cms.mjs
          cleanup
          trap - EXIT
          rm .capture-cms.mjs
      - name: Verify the final documentation and affected browser cases
        run: |
          npm run format --prefix docs
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs > "$RUNNER_TEMP/build-final.log" 2>&1 || { tail -100 "$RUNNER_TEMP/build-final.log"; exit 1; }
          npm run check:budget --prefix docs
          npm test --prefix docs
          cd docs
          npm run test:browser -- tests/galleries.spec.ts tests/ui-polish.spec.ts
      - name: Prepare the final source for publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # No component, test, or application logic may differ from the fully verified candidate.
          git diff "$REVIEWED_COMMIT" --exit-code -- registry docs ':!docs/src/data/templates.ts' ':!docs/public/template-previews'
          rm .github/workflows/visual-review-once.yml
          git add registry docs .github/workflows/visual-review-once.yml
          git diff --cached --check
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/final-review"
          git diff --cached > "$RUNNER_TEMP/final-review/changes.patch"
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(endpoint,payload=None):
              request=urllib.request.Request(base+endpoint,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA']
          if api('/git/ref/heads/main')['object']['sha']!=parent:raise SystemExit('main moved; refusing stale publication')
          entries=[]
          for line in subprocess.check_output(['git','diff','--cached','--name-status','--no-renames'],text=True).splitlines():
              status,filename=line.split('\t',1)
              entry={'path':filename,'mode':'100644','type':'blob'}
              if status=='D':entry['sha']=None
              elif filename.endswith('.png'):entry['sha']=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(Path(filename).read_bytes()).decode()})['sha']
              else:entry['content']=Path(filename).read_text()
              entries.append(entry)
          tree=api('/git/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          commit=api('/git/commits',{'message':'fix: finalize reviewed visual fixes and isolate the CMS thumbnail','tree':tree['sha'],'parents':[parent,os.environ['REVIEWED_COMMIT']]})
          result={'prepared_commit':commit['sha'],'tree':tree['sha'],'expected_main':parent,'reviewed_commit':os.environ['REVIEWED_COMMIT']}
          Path(os.environ['RUNNER_TEMP'],'final-review','commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: Preserve final capture and publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: final-visual-publication
          path: |
            ${{ runner.temp }}/final-review
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/capture-server.log
            docs/test-results
            docs/playwright-report
          retention-days: 3
          if-no-files-found: error
