name: Verify visual review once

on:
  push:
    branches: [main]
    paths: [.github/workflows/visual-review-once.yml]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Preserve exact source and merge evidence
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/consolidation"
          cd "$RUNNER_TEMP/consolidation"
          git -C "$GITHUB_WORKSPACE" archive HEAD | gzip > main-source.tar.gz
          git -C "$GITHUB_WORKSPACE" archive 98b27f1febd43f6e6fbdbf34285a2b56e5d156cc | gzip > branch-source.tar.gz
          git -C "$GITHUB_WORKSPACE" diff 9ab42af32e6ee1794d972ca4ce9ab0b6c8ca5130 98b27f1febd43f6e6fbdbf34285a2b56e5d156cc > branch-changes.patch
          git -C "$GITHUB_WORKSPACE" log --oneline 9ab42af32e6ee1794d972ca4ce9ab0b6c8ca5130..98b27f1febd43f6e6fbdbf34285a2b56e5d156cc > branch-commits.txt
          git -C "$GITHUB_WORKSPACE" show 62a0ebe38f464f1a75d613e045aa2cf34d33ec94:.github/workflows/visual-review-once.yml > original-review.yml
          set +e
          git -C "$GITHUB_WORKSPACE" merge-tree --write-tree HEAD 98b27f1febd43f6e6fbdbf34285a2b56e5d156cc > merge-result.txt
          result=$?
          set -e
          test "$result" -le 1
          cat branch-commits.txt merge-result.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-consolidation-source
          path: ${{ runner.temp }}/consolidation
          retention-days: 3
