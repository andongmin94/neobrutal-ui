name: Prepare visual review once

on:
  push:
    branches: [main]
    paths: [.github/workflows/visual-review-once.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm run build --prefix docs
      - name: Package source and rendered site for local inspection
        run: |
          mkdir -p "$RUNNER_TEMP/visual-review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/visual-review/source.tar.gz"
          tar -czf "$RUNNER_TEMP/visual-review/site.tar.gz" -C docs/build/client .
          git rev-parse HEAD > "$RUNNER_TEMP/visual-review/source-sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-review-workspace
          path: ${{ runner.temp }}/visual-review
          retention-days: 1
          if-no-files-found: error
