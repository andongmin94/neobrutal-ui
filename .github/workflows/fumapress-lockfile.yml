name: Generate Fumapress lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fumapress-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Prepare Fumapress package manifest
        working-directory: docs
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          delete pkg.dependencies["@react-router/node"];
          delete pkg.dependencies["react-router"];
          delete pkg.devDependencies["@react-router/dev"];
          pkg.dependencies["fumadocs-core"] = "16.15.7";
          pkg.dependencies["fumadocs-mdx"] = "15.4.0";
          pkg.dependencies["fumadocs-ui"] = "npm:@fumadocs/base-ui@16.15.7";
          pkg.dependencies["fumapress"] = "1.3.1";
          pkg.engines = { node: ">=24" };
          pkg.scripts.dev = "fumapress dev";
          pkg.scripts.build = "fumapress build";
          pkg.scripts.start = "fumapress start";
          pkg.scripts.format =
            "oxlint --fix --no-error-on-unmatched-pattern app src scripts tests press.config.tsx vite.config.ts && oxfmt --write --no-error-on-unmatched-pattern app src scripts tests press.config.tsx vite.config.ts tsconfig.json package.json .oxlintrc.json .oxfmtrc.json";
          pkg.scripts.lint =
            "oxlint --deny-warnings --format unix --no-error-on-unmatched-pattern app src scripts tests press.config.tsx vite.config.ts && oxfmt --check --no-error-on-unmatched-pattern app src scripts tests press.config.tsx vite.config.ts tsconfig.json package.json .oxlintrc.json .oxfmtrc.json";
          pkg.scripts.pretypecheck = "npm run generate";
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Generate lockfile
        working-directory: docs
        run: npm install --package-lock-only --ignore-scripts

      - name: Stage generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/fumapress-lock
          git add docs/package.json docs/package-lock.json
          git commit -m "chore: stage generated Fumapress lockfile"
          git push origin HEAD:refs/heads/automation/fumapress-lock
