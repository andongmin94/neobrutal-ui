name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Verify registry
        working-directory: registry
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm run registry:validate
          npm run registry:check
      - name: Verify docs, budgets, and shared contracts
        working-directory: docs
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm run check:budget
          npm test
      - name: Install browser engines
        working-directory: docs
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify README setup and rendered existing-project integration
        run: npm run consumer:verify --prefix registry -- --integration
      - name: Save installation verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installation-checks
          retention-days: 3
          if-no-files-found: error
          path: docs/test-results/installed-consumers
      - name: Verify fresh aggregate consumers
        working-directory: registry
        run: npm run consumer:verify
      - name: Verify clean generation and unchanged sources
        run: |
          node registry/scripts/verify-generated.mjs
          git diff --binary > "$RUNNER_TEMP/generated-files.diff"
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Unexpected untracked files were created:"
            git status --short
            exit 1
          fi
      - name: Capture formatting diagnostics without modifying sources
        if: ${{ failure() }}
        shell: bash
        continue-on-error: true
        run: |
          for project in registry docs; do
            (
              cd "$project"
              if [ ! -x node_modules/.bin/oxfmt ]; then exit 0; fi
              paths=(src scripts tsconfig.json package.json .oxlintrc.json .oxfmtrc.json)
              if [ "$project" = docs ]; then
                paths+=(tests press.config.tsx vite.config.ts)
              else
                paths+=(tsconfig.consumer.json)
              fi
              node_modules/.bin/oxfmt --list-different "${paths[@]}" > "$RUNNER_TEMP/$project-format-files.txt" || true
              while IFS= read -r file || [ -n "$file" ]; do
                if [ ! -f "$file" ]; then continue; fi
                output="$RUNNER_TEMP/formatted/$project/$file"
                mkdir -p "$(dirname "$output")"
                node_modules/.bin/oxfmt --stdin-filepath "$file" < "$file" > "$output"
                diff -u --label "a/$project/$file" --label "b/$project/$file" "$file" "$output" >> "$RUNNER_TEMP/formatting.diff" || true
              done < "$RUNNER_TEMP/$project-format-files.txt"
            )
          done
      - name: Save failed verification reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-browser-checks
          retention-days: 3
          path: |
            docs/test-results
            registry/registry.json
            registry/public/r
            docs/src/data/component-descriptions.json
            docs/src/styling/theme.css
            ${{ runner.temp }}/generated-files.diff
            ${{ runner.temp }}/formatting.diff
            ${{ runner.temp }}/formatted

  verify-browsers:
    name: Documentation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-light
            script: test:browser
            browser: chromium
            report: playwright-report
          - project: mobile-dark
            script: test:browser
            browser: chromium
            report: playwright-report
          - project: chromium-reflow
            script: test:browser:cross
            browser: chromium
            report: playwright-report-cross
          - project: firefox-desktop
            script: test:browser:cross
            browser: firefox
            report: playwright-report-cross
          - project: webkit-mobile
            script: test:browser:cross
            browser: webkit
            report: playwright-report-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build documentation and synchronized registry sources
        run: |
          npm ci --prefix docs
          npm run build --prefix docs
      - name: Install browser engine
        working-directory: docs
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify documentation project
        working-directory: docs
        run: npm run ${{ matrix.script }} -- --project=${{ matrix.project }}
      - name: Save documentation review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-review-${{ matrix.project }}
          retention-days: 14
          if-no-files-found: error
          path: docs/${{ matrix.report }}

  verify-installations:
    name: Independent installations (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - name: Build registry installation inputs
        run: |
          npm ci --prefix registry
          npm run build --prefix registry
      - name: Verify independent items
        run: node registry/scripts/verify-independent-items.mjs --shard=${{ matrix.shard }}/3
      - name: Save independent installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-installations-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: ignore
          path: docs/test-results/independent-items

  verify-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify
      - verify-installations
      - verify-browsers
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Build registry verification inputs
        run: npm run build --prefix registry
      - name: Wait for the current production documentation
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:deployment
      - name: Verify production registry
        run: npm run registry:verify-live --prefix registry
      - name: Install representative items from production
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=dialog --registry-url=https://neobrutal-ui.andongmin.com/r
          npm run consumer:verify -- next --item=blog-template --registry-url=https://neobrutal-ui.andongmin.com/r

  verify-deployed-browsers:
    name: Deployed documentation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-deployment
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-reflow
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-mobile
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build synchronized registry verification inputs
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
      - name: Install browser engine
        working-directory: docs
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify deployed documentation project
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
        run: npm run test:browser:cross -- --project=${{ matrix.project }}
      - name: Save deployed documentation review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployed-docs-review-${{ matrix.project }}
          retention-days: 14
          if-no-files-found: error
          path: docs/playwright-report-cross
