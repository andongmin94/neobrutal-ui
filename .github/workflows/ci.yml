name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json

      - name: Install registry dependencies
        working-directory: registry
        run: npm ci

      - name: Verify registry sources and Next template consumers
        working-directory: registry
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm run registry:validate
          npm run registry:check

      - name: Verify fresh Next and Vite consumers
        working-directory: registry
        run: npm run consumer:verify

      - name: Verify isolated component and template consumers
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=button
          npm run consumer:verify -- vite --item=calendar
          npm run consumer:verify -- next --item=dialog
          npm run consumer:verify -- next --item=blog-template

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Verify docs
        working-directory: docs
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build

      - name: Verify generated files are current
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Untracked generated files were created:"
            git status --short
            exit 1
          fi

  verify-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - name: Install verification dependencies
        working-directory: registry
        run: npm ci
      - name: Verify deployed catalog and every item
        working-directory: registry
        run: npm run registry:verify-live
      - name: Install from production in fresh consumers
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=dialog --registry-url=https://neobrutal-ui.andongmin.com/r
          npm run consumer:verify -- next --item=blog-template --registry-url=https://neobrutal-ui.andongmin.com/r
