name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Archive the exact sources under review
        run: git archive --format=tar.gz --output=/tmp/docs-review-source.tar.gz HEAD

      - name: Save review sources
        uses: actions/upload-artifact@v7
        with:
          name: docs-review-source
          retention-days: 7
          path: /tmp/docs-review-source.tar.gz

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json

      - name: Install registry dependencies
        working-directory: registry
        run: npm ci

      - name: Verify registry sources and Next template consumers
        working-directory: registry
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm run registry:validate
          npm run registry:check

      - name: Verify fresh Next and Vite consumers
        working-directory: registry
        run: npm run consumer:verify

      - name: Verify isolated component and template consumers
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=button
          npm run consumer:verify -- vite --item=calendar
          npm run consumer:verify -- next --item=dialog
          npm run consumer:verify -- next --item=blog-template

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Verify docs and shared theme contracts
        working-directory: docs
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Verify docs interactions in desktop and mobile themes
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Verify generated files are current
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Untracked generated files were created:"
            git status --short
            exit 1
          fi

      - name: Save browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-browser-checks
          retention-days: 7
          if-no-files-found: ignore
          path: |
            docs/test-results
            docs/playwright-report

  verify-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Wait for the current production documentation
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs
      - name: Verify deployed catalog and every item
        working-directory: registry
        run: npm run registry:verify-live
      - name: Install from production in fresh consumers
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=dialog --registry-url=https://neobrutal-ui.andongmin.com/r
          npm run consumer:verify -- next --item=blog-template --registry-url=https://neobrutal-ui.andongmin.com/r
      - name: Verify the deployed documentation in real browsers
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Save production browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-production-browser-checks
          retention-days: 7
          if-no-files-found: ignore
          path: |
            docs/test-results
            docs/playwright-report
