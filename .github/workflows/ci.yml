name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json

      - name: Install registry dependencies
        working-directory: registry
        run: npm ci

      - name: Verify registry and fresh consumers
        working-directory: registry
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm run registry:validate
          npm run registry:check
          npm run consumer:verify

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Verify docs, budgets, and shared contracts
        working-directory: docs
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
          npm run check:budget
          npm test

      - name: Verify docs in Chromium, Firefox, and WebKit
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser
          npm run test:browser:cross

      - name: Verify generated files are current
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Untracked generated files were created:"
            git status --short
            exit 1
          fi

      - name: Save failed browser reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-browser-checks
          retention-days: 7
          if-no-files-found: ignore
          path: |
            docs/test-results
            docs/playwright-report
            docs/playwright-report-cross

  verify-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Wait for the current production documentation
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:deployment
      - name: Verify production headers and registry
        run: |
          npm run verify:headers --prefix docs
          npm run registry:verify-live --prefix registry
      - name: Install representative items from production
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=dialog --registry-url=https://neobrutal-ui.andongmin.com/r
          npm run consumer:verify -- next --item=blog-template --registry-url=https://neobrutal-ui.andongmin.com/r
      - name: Smoke-test the deployed docs across browser engines
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser:cross
      - name: Save failed production browser reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-production-browser-checks
          retention-days: 7
          if-no-files-found: ignore
          path: |
            docs/test-results
            docs/playwright-report-cross
