name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      comprehensive:
        description: Run all browser projects and fresh installation checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Verify registry
        working-directory: registry
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run registry:validate
          npm run registry:check
      - name: Verify docs, budgets, and shared contracts
        working-directory: docs
        run: |
          npm run lint
          npm run typecheck
          npm run build:site
          npm run check:budget
          npm test
      - name: Install core browser engine
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Verify core documentation and complete local registry
        working-directory: docs
        run: npm run test:browser -- docs.spec.ts local-registry.spec.ts analytics.spec.ts
      - name: Verify representative fresh consumers
        working-directory: registry
        run: |
          npm run consumer:verify -- vite --item=dialog
          npm run consumer:verify -- next --item=dialog
      - name: Install comprehensive browser engines
        if: ${{ inputs.comprehensive == true }}
        working-directory: docs
        run: npx playwright install --with-deps firefox webkit
      - name: Verify README setup and rendered existing-project integration
        if: ${{ inputs.comprehensive == true }}
        run: npm run consumer:verify --prefix registry -- --integration
      - name: Save installation verification evidence
        if: ${{ always() && inputs.comprehensive == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installation-checks
          retention-days: 3
          if-no-files-found: error
          path: docs/test-results/installed-consumers
      - name: Verify fresh aggregate consumers
        if: ${{ inputs.comprehensive == true }}
        working-directory: registry
        run: npm run consumer:verify
      - name: Verify official directory integration
        if: ${{ inputs.comprehensive == true }}
        working-directory: registry
        run: npm run registry:verify-directory
      - name: Verify clean generation and unchanged sources
        run: |
          node registry/scripts/verify-generated.mjs
          git diff --binary > "$RUNNER_TEMP/generated-files.diff"
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Unexpected untracked files were created:"
            git status --short
            exit 1
          fi
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: |
          audit_status=0
          npm audit --prefix registry --audit-level=high || audit_status=1
          npm audit --prefix docs --audit-level=high || audit_status=1
          exit "$audit_status"
      - name: Capture formatting diagnostics without modifying sources
        if: ${{ failure() }}
        shell: bash
        continue-on-error: true
        run: |
          for project in registry docs; do
            (
              cd "$project"
              if [ ! -x node_modules/.bin/oxfmt ]; then exit 0; fi
              paths=(src scripts tsconfig.json package.json .oxlintrc.json .oxfmtrc.json)
              if [ "$project" = docs ]; then
                paths+=(tests press.config.tsx vite.config.ts)
              else
                paths+=(tsconfig.consumer.json)
              fi
              node_modules/.bin/oxfmt --list-different "${paths[@]}" > "$RUNNER_TEMP/$project-format-files.txt" || true
              while IFS= read -r file || [ -n "$file" ]; do
                if [ ! -f "$file" ]; then continue; fi
                output="$RUNNER_TEMP/formatted/$project/$file"
                mkdir -p "$(dirname "$output")"
                node_modules/.bin/oxfmt --stdin-filepath "$file" < "$file" > "$output"
                diff -u --label "a/$project/$file" --label "b/$project/$file" "$file" "$output" >> "$RUNNER_TEMP/formatting.diff" || true
              done < "$RUNNER_TEMP/$project-format-files.txt"
            )
          done
      - name: Save failed verification reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-browser-checks
          retention-days: 3
          path: |
            docs/test-results
            registry/registry.json
            registry/public/r
            docs/src/data/component-descriptions.json
            docs/src/styling/theme.css
            ${{ runner.temp }}/generated-files.diff
            ${{ runner.temp }}/formatting.diff
            ${{ runner.temp }}/formatted

  verify-browsers:
    name: Documentation (${{ matrix.project }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.comprehensive == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-light
            script: test:browser
            browser: chromium
            report: playwright-report
          - project: mobile-dark
            script: test:browser
            browser: chromium
            report: playwright-report
          - project: chromium-reflow
            script: test:browser:cross
            browser: chromium
            report: playwright-report-cross
          - project: firefox-desktop
            script: test:browser:cross
            browser: firefox
            report: playwright-report-cross
          - project: webkit-mobile
            script: test:browser:cross
            browser: webkit
            report: playwright-report-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build documentation and synchronized registry sources
        run: |
          npm ci --prefix docs
          npm run build --prefix docs
      - name: Install browser engine
        working-directory: docs
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify documentation project
        working-directory: docs
        run: npm run ${{ matrix.script }} -- --project=${{ matrix.project }}
      - name: Save documentation review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-review-${{ matrix.project }}
          retention-days: 14
          if-no-files-found: error
          path: docs/${{ matrix.report }}

  verify-installations:
    name: Independent installations (${{ matrix.shard }}/3)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.comprehensive == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - name: Build registry installation inputs
        run: |
          npm ci --prefix registry
          npm run build --prefix registry
      - name: Verify independent items
        run: node registry/scripts/verify-independent-items.mjs --shard=${{ matrix.shard }}/3
      - name: Save independent installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: independent-installations-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: ignore
          path: docs/test-results/independent-items

  verify-deployment:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Build registry verification inputs
        run: npm run build --prefix registry
      - name: Wait for the current production documentation
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:deployment
      - name: Install browser engine
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Check core production paths
        working-directory: docs
        env:
          DOCS_TEST_URL: https://neobrutal-ui.andongmin.com
        run: npm run test:browser:smoke
      - name: Save production smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-smoke
          retention-days: 14
          if-no-files-found: error
          path: docs/playwright-report-smoke
