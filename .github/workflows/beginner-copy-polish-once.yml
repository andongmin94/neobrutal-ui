name: Polish beginner-facing copy once

on:
  push:
    paths:
      - .github/workflows/beginner-copy-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - name: Replace the remaining advanced copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "Source-owned registry components": "Installable components and recipes",
              "Source-owned React components": "Editable React components",
              "Source-owned components": "Editable components",
              "source-owned components": "editable components",
              "across the registry catalog": "in the installable catalog",
          }
          expected = {
              "docs/src/examples/ui/separator.tsx",
              "docs/src/examples/ui/hover-card.tsx",
              "docs/src/examples/ui/navigation-menu.tsx",
              "docs/src/examples/ui/chart/chart-pie-donut.tsx",
              "docs/src/examples/ui/chart/chart-pie-simple.tsx",
              "docs/src/examples/ui/chart/chart-pie-label.tsx",
              "docs/src/examples/ui/chart/chart-pie-legend.tsx",
              "docs/src/examples/ui/chart/chart-pie-label-list.tsx",
              "docs/src/examples/ui/chart/chart-pie-donut-active.tsx",
              "docs/src/examples/ui/chart/chart-pie-label-custom.tsx",
              "docs/src/examples/ui/chart/chart-pie-donut-text.tsx",
              "docs/src/special-pages/charts-examples.tsx",
              "docs/src/data/charts.ts",
          }
          changed = set()

          for path in Path("docs/src").rglob("*"):
              if path.suffix not in {".ts", ".tsx"}:
                  continue
              source = path.read_text(encoding="utf-8")
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed.add(path.as_posix())

          missing = expected - changed
          unexpected = changed - expected
          if missing or unexpected:
              raise SystemExit(f"missing={sorted(missing)} unexpected={sorted(unexpected)}")

          leftovers = []
          for path in Path("docs/src").rglob("*"):
              if path.suffix in {".ts", ".tsx"}:
                  text = path.read_text(encoding="utf-8")
                  if "Source-owned" in text or "source-owned" in text:
                      leftovers.append(path.as_posix())
          if leftovers:
              raise SystemExit(f"remaining advanced copy: {leftovers}")
          PY
      - name: Regenerate and verify the docs
        run: |
          npm run build --prefix docs
          npm run lint --prefix docs
          git diff --check
      - name: Remove this one-time workflow and publish
        run: |
          rm .github/workflows/beginner-copy-polish-once.yml
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/beginner-copy-polish-once.yml",
              "docs/src/examples/ui/separator.tsx",
              "docs/src/examples/ui/hover-card.tsx",
              "docs/src/examples/ui/navigation-menu.tsx",
              "docs/src/examples/ui/chart/chart-pie-donut.tsx",
              "docs/src/examples/ui/chart/chart-pie-simple.tsx",
              "docs/src/examples/ui/chart/chart-pie-label.tsx",
              "docs/src/examples/ui/chart/chart-pie-legend.tsx",
              "docs/src/examples/ui/chart/chart-pie-label-list.tsx",
              "docs/src/examples/ui/chart/chart-pie-donut-active.tsx",
              "docs/src/examples/ui/chart/chart-pie-label-custom.tsx",
              "docs/src/examples/ui/chart/chart-pie-donut-text.tsx",
              "docs/src/special-pages/charts-examples.tsx",
              "docs/src/data/charts.ts",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"expected={sorted(allowed)} actual={sorted(changed)}")
          PY
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; refusing to overwrite unrelated work."
            exit 1
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finish beginner-facing copy polish"
          git push origin HEAD:main
