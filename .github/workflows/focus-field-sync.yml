name: Sync focus field outputs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/focus-field-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Regenerate managed copies
        run: |
          npm ci --prefix registry
          npm run build --prefix registry
      - name: Verify focused contracts
        run: |
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix registry
          npm run typecheck --prefix docs
      - name: Commit generated outputs and remove helper
        run: |
          rm .github/workflows/focus-field-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync compact focus outputs"
          git push origin HEAD:main
