name: Readiness workspace

on:
  push:
    branches: [chore/registry-directory-ready]
    paths: [.github/workflows/readiness-workspace.yml]

permissions:
  contents: read

jobs:
  upstream-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - run: npm ci --prefix registry
      - name: Fetch the official directory and validator
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/shadcn-ui/ui.git /tmp/shadcn-directory
          git -C /tmp/shadcn-directory sparse-checkout set apps/v4/registry apps/v4/lib apps/v4/scripts
          echo "UPSTREAM_SHA=$(git -C /tmp/shadcn-directory rev-parse HEAD)"
      - name: Add the proposed entry and run the unmodified official validator
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const file = '/tmp/shadcn-directory/apps/v4/registry/directory.json';
          const entries = JSON.parse(fs.readFileSync(file, 'utf8'));
          const entry = JSON.parse(fs.readFileSync('registry/directory-entry.json', 'utf8'));
          assert.ok(!entries.some(item => item.name.toLowerCase() === entry.name.toLowerCase()), 'Namespace is already registered');
          entries.push(entry);
          entries.sort((a, b) => a.name.localeCompare(b.name, 'en'));
          fs.writeFileSync(file, `${JSON.stringify(entries, null, 2)}\n`);
          JS
          ln -s "$GITHUB_WORKSPACE/registry/node_modules" /tmp/shadcn-directory/apps/v4/node_modules
          cd /tmp/shadcn-directory/apps/v4
          "$GITHUB_WORKSPACE/registry/node_modules/.bin/tsx" scripts/validate-registries.mts
          git diff -- registry/directory.json > /tmp/neobrutal-ui-directory.patch
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: shadcn-directory-submission
          path: /tmp/neobrutal-ui-directory.patch
          retention-days: 7
