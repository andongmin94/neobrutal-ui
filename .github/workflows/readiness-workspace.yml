name: Readiness workspace

on:
  push:
    branches: [chore/registry-directory-ready]
    paths:
      - .github/workflows/readiness-workspace.yml
      - .github/readiness-edit.py

permissions:
  contents: write

jobs:
  workspace:
    if: github.repository == 'andongmin94/neobrutal-ui' && github.ref == 'refs/heads/chore/registry-directory-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install dependencies and apply compatible advisory fixes
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm pkg set --prefix registry 'devDependencies.next=^16.3.3'
          npm audit fix --prefix registry
          npm audit fix --prefix docs
          npm audit --prefix registry
          npm audit --prefix docs
      - name: Apply reviewed source edits
        run: |
          python3 .github/readiness-edit.py
          sed -i 's/next: "\^16.3.0"/next: "^16.3.3"/' registry/scripts/verify-consumer.mjs
      - name: Build and synchronize the candidate
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run lint --prefix docs
      - name: Persist candidate sources
        run: |
          rm .github/readiness-edit.py
          git restore .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md registry docs .github/readiness-edit.py
          git diff --cached --stat
          git commit -m 'feat: prepare flat registry and isolated consumers; patch dependency advisories'
          git push origin HEAD:chore/registry-directory-ready
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
      - name: Verify registry and documentation
        run: |
          npm run typecheck --prefix registry
          npm run registry:validate --prefix registry
          npm run registry:check --prefix registry
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Verify all-item and isolated installations
        working-directory: registry
        run: |
          npm run consumer:verify
          npm run consumer:verify -- vite --item=button
          npm run consumer:verify -- vite --item=calendar
          npm run consumer:verify -- next --item=dialog
          npm run consumer:verify -- next --item=blog-template
      - name: Summarize validation
        run: |
          git diff --stat
          git diff --exit-code
          echo "Verified candidate $(git rev-parse HEAD)"
