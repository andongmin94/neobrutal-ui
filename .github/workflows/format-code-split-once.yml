name: Format code-split sources once

on:
  push:
    paths:
      - .github/workflows/format-code-split-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - name: Apply the repository formatter
        run: |
          npm run format --prefix docs
          git diff --check
          python3 - <<'PY'
          import subprocess

          allowed = {
              "docs/app/components/special-pages.tsx",
              "docs/app/components/stars-page.tsx",
              "docs/app/components/template-pages.tsx",
              "docs/tests/cross-browser-pages.spec.ts",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected={sorted(unexpected)}")
          PY
      - name: Publish formatted files
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; refusing to overwrite unrelated work."
            exit 1
          fi
          git add docs/app/components docs/tests/cross-browser-pages.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format deferred special pages"
          git push origin HEAD:main
