name: Visual audit summary once

on:
  push:
    paths:
      - .github/workflows/visual-audit-summary-once.yml

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the full audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/andongmin94/neobrutal-ui/actions/artifacts/10540330547/zip \
            --output audit.zip
          mkdir audit
          unzip -q audit.zip -d audit

      - name: Print route-level findings
        run: |
          report_path="$(find audit -name report.json -print -quit)"
          node --input-type=module "$report_path" <<'NODE'
          NODE
        shell: bash

      - name: Summarize report
        run: |
          report_path="$(find audit -name report.json -print -quit)"
          REPORT_PATH="$report_path" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const categories = [
            "clippedText",
            "horizontalEscape",
            "nestedVerticalScroll",
            "tinyControls",
          ];
          const findings = report
            .map((entry) => ({
              route: entry.route,
              viewport: entry.viewport.name,
              colorScheme: entry.colorScheme,
              status: entry.status,
              runtimeErrors: entry.runtimeErrors,
              pageOverflow: entry.scrollWidth > entry.clientWidth + 1,
              issues: Object.fromEntries(
                categories.map((category) => [category, entry.issues[category] ?? []]),
              ),
            }))
            .filter(
              (entry) =>
                entry.status !== 200 ||
                entry.runtimeErrors.length > 0 ||
                entry.pageOverflow ||
                categories.some((category) => entry.issues[category].length > 0),
            );

          const totals = {
            captures: report.length,
            routes: new Set(report.map((entry) => entry.route)).size,
            non200: findings.filter((entry) => entry.status !== 200).length,
            runtimeErrors: findings.reduce((sum, entry) => sum + entry.runtimeErrors.length, 0),
            pageOverflow: findings.filter((entry) => entry.pageOverflow).length,
            ...Object.fromEntries(
              categories.map((category) => [
                category,
                findings.reduce((sum, entry) => sum + entry.issues[category].length, 0),
              ]),
            ),
          };

          console.log("VISUAL_AUDIT_TOTALS");
          console.log(JSON.stringify(totals, null, 2));
          console.log("VISUAL_AUDIT_FINDINGS");
          for (const finding of findings) {
            console.log(`\n${finding.colorScheme}/${finding.viewport} ${finding.route}`);
            if (finding.status !== 200) console.log(`  status: ${finding.status}`);
            if (finding.pageOverflow) console.log("  page overflow: true");
            for (const error of finding.runtimeErrors) console.log(`  runtime: ${error}`);
            for (const category of categories) {
              const issues = finding.issues[category];
              if (issues.length === 0) continue;
              console.log(`  ${category}: ${issues.length}`);
              for (const issue of issues.slice(0, 6)) {
                console.log(
                  `    - ${issue.selector} ${JSON.stringify(issue.rect)} ${JSON.stringify(issue.text)}`,
                );
              }
            }
          }
          NODE
