name: Recover verified UI audit commit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-audit-summary-once.yml

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Recover the verified tree without repeating tests or moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          expected = '04bc78a1f4b0ec81b8972337d6ea3625f9a54521'
          current = os.environ['GITHUB_SHA']
          workflow = '.github/workflows/visual-audit-summary-once.yml'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(endpoint, payload=None, raw=False):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + endpoint, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  content = response.read()
              return content.decode('utf-8-sig') if raw else json.loads(content)

          run = request('/actions/runs/35374112043')
          if run['conclusion'] != 'success' or run['head_sha'] != expected:
              raise SystemExit('The required verification did not pass on the expected source.')
          changes = request('/compare/' + expected + '...' + current)
          if changes.get('status') != 'ahead' or [f['filename'] for f in changes['files']] != [workflow]:
              raise SystemExit('Unrelated changes exist; do not republish an older tree.')
          if request('/git/ref/heads/main')['object']['sha'] != current:
              raise SystemExit('main advanced; refusing stale publication.')
          logs = request('/actions/jobs/105694649535/logs', raw=True)
          matches = set(re.findall(r'PREPARED_COMMIT=([0-9a-f]{40})(?:\r?\n|$)', logs))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one verified commit identifier.')
          prepared_sha = matches.pop()
          prepared = request('/git/commits/' + prepared_sha)
          if [p['sha'] for p in prepared['parents']] != [expected]:
              raise SystemExit('Verified commit parent does not match the tested source.')
          commit = request('/git/commits', {
              'message': prepared['message'],
              'tree': prepared['tree']['sha'],
              'parents': [current],
          })
          print('VERIFIED_ORIGINAL=' + prepared_sha)
          print('PREPARED_COMMIT=' + commit['sha'])
          print('VERIFIED_TREE=' + prepared['tree']['sha'])
          print('EXPECTED_MAIN=' + current)
          print('No branch reference was changed.')
          PY
