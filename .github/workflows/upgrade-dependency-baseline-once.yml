name: Upgrade dependency baseline once

on:
  push:
    paths:
      - .github/workflows/upgrade-dependency-baseline-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json

      - name: Update dependency baselines and references
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";

          function updateJson(filePath, update) {
            const value = JSON.parse(fs.readFileSync(filePath, "utf8"));
            update(value);
            fs.writeFileSync(filePath, `${JSON.stringify(value, null, 2)}\n`);
          }

          updateJson("registry/package.json", (pkg) => {
            pkg.devDependencies["@base-ui/react"] = "^1.8.0";
            pkg.devDependencies.shadcn = "^4.21.0";
            pkg.devDependencies.react = "19.2.8";
            pkg.devDependencies["react-dom"] = "19.2.8";
            pkg.devDependencies.next = "^16.3.5";
            pkg.devDependencies.vite = "^8.2.2";
          });

          updateJson("docs/package.json", (pkg) => {
            pkg.dependencies["@base-ui/react"] = "^1.8.0";
            pkg.devDependencies["@playwright/test"] = "1.63.0";
            pkg.devDependencies.typescript = "^7.0.2";
            pkg.devDependencies.vite = "^8.2.2";
          });

          const replacements = new Map([
            ["@base-ui/react@^1.6.0", "@base-ui/react@^1.8.0"],
            ["shadcn@^4.13.0", "shadcn@^4.21.0"],
            ['react: "19.2.7"', 'react: "19.2.8"'],
            ['"react-dom": "19.2.7"', '"react-dom": "19.2.8"'],
            ['"next": "^16.3.3"', '"next": "^16.3.5"'],
            ['"vite": "^8.1.4"', '"vite": "^8.2.2"'],
            ['"typescript": "^6.0.3"', '"typescript": "^7.0.2"'],
          ]);
          const textExtensions = new Set([
            ".css",
            ".html",
            ".json",
            ".md",
            ".mdx",
            ".mjs",
            ".ts",
            ".tsx",
            ".yml",
            ".yaml",
          ]);
          const tracked = execFileSync("git", ["ls-files"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);

          for (const filePath of tracked) {
            if (filePath.endsWith("package-lock.json")) continue;
            if (!textExtensions.has(path.extname(filePath))) continue;
            const source = fs.readFileSync(filePath, "utf8");
            let updated = source;
            for (const [from, to] of replacements) updated = updated.replaceAll(from, to);
            if (updated !== source) fs.writeFileSync(filePath, updated);
          }
          NODE

      - name: Refresh lockfiles
        run: |
          npm install --prefix registry --no-audit --no-fund
          npm install --prefix docs --no-audit --no-fund

      - name: Verify upgraded registry and consumers
        run: |
          npm run format --prefix registry
          npm run lint --prefix registry
          npm run typecheck --prefix registry
          npm run build --prefix registry
          npm run registry:validate --prefix registry
          npm run registry:check --prefix registry
          npm run consumer:verify --prefix registry

      - name: Verify upgraded documentation
        run: |
          npm run format --prefix docs
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:budget --prefix docs
          npm test --prefix docs

      - name: Verify resolved versions and stale references
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";

          const expected = {
            registry: {
              "@base-ui/react": "1.8.0",
              next: "16.3.5",
              react: "19.2.8",
              "react-dom": "19.2.8",
              shadcn: "4.21.0",
              typescript: "7.0.2",
              vite: "8.2.2",
            },
            docs: {
              "@base-ui/react": "1.8.0",
              "@playwright/test": "1.63.0",
              react: "19.2.8",
              "react-dom": "19.2.8",
              typescript: "7.0.2",
              vite: "8.2.2",
            },
          };

          for (const [project, versions] of Object.entries(expected)) {
            const lock = JSON.parse(fs.readFileSync(`${project}/package-lock.json`, "utf8"));
            for (const [name, version] of Object.entries(versions)) {
              const resolved = lock.packages[`node_modules/${name}`]?.version;
              if (resolved !== version) {
                throw new Error(`${project}: expected ${name}@${version}, resolved ${resolved}`);
              }
            }
          }

          const stale = ["@base-ui/react@^1.6.0", "shadcn@^4.13.0"];
          const textExtensions = new Set([
            ".css",
            ".html",
            ".json",
            ".md",
            ".mdx",
            ".mjs",
            ".ts",
            ".tsx",
            ".yml",
            ".yaml",
          ]);
          const tracked = execFileSync("git", ["ls-files"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);
          const leftovers = [];
          for (const filePath of tracked) {
            if (filePath.endsWith("package-lock.json")) continue;
            if (!textExtensions.has(path.extname(filePath))) continue;
            const source = fs.readFileSync(filePath, "utf8");
            for (const value of stale) {
              if (source.includes(value)) leftovers.push(`${filePath}: ${value}`);
            }
          }
          if (leftovers.length) throw new Error(`Stale dependency references:\n${leftovers.join("\n")}`);
          NODE
          git diff --check

      - name: Remove this workflow and publish the upgrade
        run: |
          rm .github/workflows/upgrade-dependency-baseline-once.yml
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; refusing to overwrite unrelated work."
            exit 1
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Base UI and shadcn baseline"
          git push origin HEAD:main
