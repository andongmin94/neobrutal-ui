name: Visual audit capture once

on:
  push:
    paths:
      - .github/workflows/visual-audit-once.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Capture every docs and template route
        working-directory: docs
        env:
          AUDIT_BASE_URL: https://neobrutal-ui.andongmin.com
        run: |
          google-chrome --version
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { chromium } from "@playwright/test";

          const baseURL = process.env.AUDIT_BASE_URL;
          const outputRoot = path.resolve("visual-audit");
          fs.rmSync(outputRoot, { force: true, recursive: true });
          fs.mkdirSync(outputRoot, { recursive: true });

          const componentRoutes = fs
            .readdirSync(path.resolve("content/docs"))
            .filter((name) => name.endsWith(".mdx"))
            .map((name) => name.replace(/\.mdx$/, ""))
            .map((slug) => (slug === "index" ? "/docs" : `/docs/${slug}`));

          const routes = [
            "/",
            "/styling",
            "/charts",
            "/stars",
            "/templates",
            "/templates/blog",
            "/templates/portfolio",
            "/templates/cms",
            "/templates/links",
            ...componentRoutes,
          ].filter((route, index, all) => all.indexOf(route) === index);

          const viewports = [
            { name: "desktop", width: 1440, height: 1000 },
            { name: "mobile", width: 390, height: 844 },
          ];
          const darkRoutes = new Set([
            "/",
            "/docs/button",
            "/docs/data-table",
            "/docs/dialog",
            "/docs/sheet",
            "/styling",
            "/charts",
            "/templates",
            "/templates/blog",
            "/templates/portfolio",
            "/templates/cms",
            "/templates/links",
          ]);

          const browser = await chromium.launch({ channel: "chrome", headless: true });
          const report = [];

          function safeName(route) {
            return route === "/" ? "home" : route.slice(1).replaceAll("/", "--");
          }

          async function auditRoute(route, viewport, colorScheme) {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              colorScheme,
              reducedMotion: "reduce",
              deviceScaleFactor: 1,
            });
            await context.addInitScript((scheme) => {
              try {
                localStorage.setItem("theme", scheme);
              } catch {}
            }, colorScheme);
            const page = await context.newPage();
            const runtimeErrors = [];
            page.on("pageerror", (error) => runtimeErrors.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") runtimeErrors.push(`console: ${message.text()}`);
            });

            const response = await page.goto(`${baseURL}${route}`, {
              waitUntil: "domcontentloaded",
              timeout: 30000,
            });
            await page.locator('html[data-hydrated="true"]').waitFor({ timeout: 30000 });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(250);

            const metrics = await page.evaluate(() => {
              const viewportWidth = document.documentElement.clientWidth;
              const isVisible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return (
                  style.display !== "none" &&
                  style.visibility !== "hidden" &&
                  Number(style.opacity) !== 0 &&
                  rect.width > 0 &&
                  rect.height > 0
                );
              };
              const describe = (element) => {
                const id = element.id ? `#${element.id}` : "";
                const classes = [...element.classList].slice(0, 3).map((name) => `.${name}`).join("");
                return `${element.tagName.toLowerCase()}${id}${classes}`;
              };
              const compactText = (element) =>
                (element.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 90);
              const issues = {
                clippedText: [],
                horizontalEscape: [],
                nestedVerticalScroll: [],
                tinyControls: [],
              };

              for (const element of document.querySelectorAll("body *")) {
                if (!(element instanceof HTMLElement) || !isVisible(element)) continue;
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                const item = {
                  selector: describe(element),
                  text: compactText(element),
                  rect: {
                    x: Math.round(rect.x),
                    y: Math.round(rect.y),
                    width: Math.round(rect.width),
                    height: Math.round(rect.height),
                  },
                };

                if (
                  rect.left < -2 ||
                  (rect.right > viewportWidth + 2 && style.position !== "fixed" && style.position !== "sticky")
                ) {
                  issues.horizontalEscape.push(item);
                }

                const hasText = compactText(element).length > 0;
                const clipsX = element.scrollWidth > element.clientWidth + 2;
                const clipsY = element.scrollHeight > element.clientHeight + 2;
                if (
                  hasText &&
                  (clipsX || clipsY) &&
                  ["hidden", "clip"].includes(style.overflow) &&
                  !element.matches("pre, code, [data-radix-scroll-area-viewport]")
                ) {
                  issues.clippedText.push(item);
                }

                if (
                  element.clientHeight >= 56 &&
                  element.scrollHeight > element.clientHeight + 8 &&
                  ["auto", "scroll"].includes(style.overflowY) &&
                  !element.matches("pre, code, textarea, [data-slot='scroll-area-viewport']")
                ) {
                  issues.nestedVerticalScroll.push(item);
                }

                const interactive =
                  element.matches("button, input, select, textarea, a[href], [role='button'], [role='tab'], [role='option']") &&
                  !element.hasAttribute("disabled");
                if (interactive && (rect.width < 28 || rect.height < 28)) {
                  issues.tinyControls.push(item);
                }
              }

              for (const list of Object.values(issues)) list.splice(30);
              return {
                title: document.title,
                bodyHeight: document.body.scrollHeight,
                clientWidth: viewportWidth,
                scrollWidth: document.documentElement.scrollWidth,
                issues,
              };
            });

            const folder = path.join(outputRoot, colorScheme, viewport.name);
            fs.mkdirSync(folder, { recursive: true });
            const filename = `${safeName(route)}.jpg`;
            await page.screenshot({
              path: path.join(folder, filename),
              fullPage: true,
              type: "jpeg",
              quality: 58,
              animations: "disabled",
              caret: "hide",
              timeout: 30000,
            });

            report.push({
              route,
              viewport,
              colorScheme,
              status: response?.status() ?? null,
              runtimeErrors,
              ...metrics,
            });
            await context.close();
          }

          for (const route of routes) {
            for (const viewport of viewports) {
              await auditRoute(route, viewport, "light");
            }
          }

          for (const route of routes.filter((route) => darkRoutes.has(route))) {
            for (const viewport of viewports) {
              await auditRoute(route, viewport, "dark");
            }
          }

          await browser.close();
          fs.writeFileSync(path.join(outputRoot, "report.json"), JSON.stringify(report, null, 2));
          fs.writeFileSync(
            path.join(outputRoot, "routes.json"),
            JSON.stringify({ routes, viewports, darkRoutes: [...darkRoutes] }, null, 2),
          );
          console.log(`Captured ${report.length} route and viewport combinations.`);
          NODE

      - name: Upload visual audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-visual-audit
          path: docs/visual-audit
          retention-days: 2
          if-no-files-found: error
