name: Synchronize generated artifacts once

on:
  push:
    paths:
      - .github/workflows/sync-generated-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - name: Install registry dependencies
        run: npm ci --prefix registry
      - name: Regenerate committed artifacts
        run: |
          npm run build --prefix registry
          git diff --check
      - name: Publish generated artifacts
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; refusing to overwrite unrelated work."
            exit 1
          fi
          git add \
            registry/registry.json \
            registry/public \
            docs/public/r \
            docs/.registry-sync-manifest.json \
            docs/src/components/ui \
            docs/src/components/templates \
            docs/src/data \
            docs/src/hooks \
            docs/src/lib \
            docs/src/styling/theme.css
          if git diff --cached --quiet; then
            echo "Generated artifacts were already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize generated registry artifacts"
          git push origin HEAD:main
