name: Review template states once

on:
  push:
    branches: [main]
    paths: [.github/workflows/template-review-once.yml]

permissions:
  contents: write

concurrency:
  group: template-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install and build the unmodified documentation
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          cd docs
          npx playwright install --with-deps chromium
          npm run build > "$RUNNER_TEMP/template-before-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/template-before-build.log"; exit 1; }
      - name: Add focused template state regressions
        run: |
          cat > docs/tests/template-states.spec.ts <<'TS'
          import AxeBuilder from "@axe-core/playwright";
          import { expect, test, type Page } from "@playwright/test";

          async function openTemplate(page: Page, name: string) {
            await page.emulateMedia({ reducedMotion: "reduce" });
            const response = await page.goto(`/templates/${name}`);
            expect(response?.ok()).toBe(true);
            await expect(page.locator("html")).toHaveAttribute("data-hydrated", "true");
            await expect(page.locator(".special-page-loading")).toHaveCount(0);
            await expect(page.locator(".special-content")).toBeVisible();
            await page.evaluate(() => document.fonts.ready);
          }

          async function expectHealthyTemplate(page: Page) {
            const width = await page.evaluate(() => document.documentElement.scrollWidth);
            expect(width).toBeLessThanOrEqual(page.viewportSize()!.width + 1);
            const result = await new AxeBuilder({ page })
              .include(".special-content")
              .withTags(["wcag2a", "wcag2aa", "wcag21aa", "wcag22aa"])
              .analyze();
            expect(result.violations.map(({ id, nodes }) => ({ id, nodes }))).toEqual([]);
          }

          test("CMS editing a searched title keeps the same editor and input focus", async ({ page }) => {
            await openTemplate(page, "cms");
            await page.getByRole("searchbox", { name: "Search posts" }).fill("July product update");
            const title = page.getByRole("textbox", { name: "Title", exact: true });
            await title.fill("A revised release");
            await expect(title).toHaveValue("A revised release");
            await expect(title).toBeFocused();
            await expect(page.getByRole("status")).toContainText("Your edits are still here");
            await page.getByRole("textbox", { name: "Summary", exact: true }).fill("The edited summary");
            const save = page.getByRole("button", { name: "Save", exact: true });
            await save.click();
            await expect(save).toBeDisabled();
            await expect(title).toHaveValue("A revised release");
            await page.getByRole("button", { name: "Clear filters", exact: true }).click();
            await expect(page.getByRole("searchbox", { name: "Search posts" })).toHaveValue("");
            await expect(page.getByRole("region", { name: "Posts", exact: true }).getByRole("button", { name: /A revised release/ })).toHaveAttribute("aria-pressed", "true");
            await expectHealthyTemplate(page);
          });

          test("CMS editing publication status does not switch to the next filtered post", async ({ page }) => {
            await openTemplate(page, "cms");
            await page.getByRole("group", { name: "Filter posts by status" }).getByRole("button", { name: "Draft", exact: true }).click();
            const title = page.getByRole("textbox", { name: "Title", exact: true });
            await expect(title).toHaveValue("Organize your first team space");
            const published = page.getByRole("switch", { name: "Published", exact: true });
            await published.click();
            await expect(title).toHaveValue("Organize your first team space");
            await expect(published).toHaveAttribute("aria-checked", "true");
            await page.getByRole("button", { name: "Save", exact: true }).click();
            await expect(page.getByRole("button", { name: "Save", exact: true })).toBeDisabled();
            await page.getByRole("button", { name: "Clear filters", exact: true }).click();
            const posts = page.getByRole("region", { name: "Posts", exact: true });
            await expect(posts.getByRole("button", { name: /Organize your first team space/ })).toHaveAttribute("aria-pressed", "true");
            await expect(posts.getByRole("button", { name: /Public page checklist/ })).toContainText("Draft");
            await expectHealthyTemplate(page);
          });

          test("CMS empty filters recover to a post or a focused new draft", async ({ page }) => {
            await openTemplate(page, "cms");
            const search = page.getByRole("searchbox", { name: "Search posts" });
            await search.fill("no-such-post-7319");
            await expect(page.getByRole("heading", { name: "No post selected" })).toBeVisible();
            await page.getByRole("button", { name: "Clear filters", exact: true }).click();
            await expect(page.getByRole("textbox", { name: "Title", exact: true })).toHaveValue("July product update");
            await search.fill("no-such-post-7319");
            await page.getByRole("region", { name: "No post selected" }).getByRole("button", { name: "New post", exact: true }).click();
            await expect(search).toHaveValue("");
            const title = page.getByRole("textbox", { name: "Title", exact: true });
            await expect(title).toHaveValue("Untitled post");
            await expect(title).toBeFocused();
            await expectHealthyTemplate(page);
          });

          test("blog empty results keep a usable search and keyboard recovery", async ({ page }) => {
            await openTemplate(page, "blog");
            const search = page.getByRole("searchbox", { name: "Search posts" });
            await search.fill("no-such-post-7319");
            await expect(page.getByText("No posts found.", { exact: true })).toBeVisible();
            await expect(search).toBeFocused();
            await search.press("Tab");
            const clear = page.getByRole("button", { name: "Clear search", exact: true });
            await expect(clear).toBeFocused();
            await clear.press("Enter");
            await expect(search).toBeFocused();
            await expect(page.locator(".special-content article").first()).toBeVisible();
            await expectHealthyTemplate(page);
          });

          test("portfolio details open and close by keyboard without losing their trigger", async ({ page }) => {
            await openTemplate(page, "portfolio");
            const details = page.locator(".special-content details").first();
            const summary = details.locator("summary");
            await summary.focus();
            await summary.press("Enter");
            await expect(details).toHaveAttribute("open", "");
            await expect(details.locator("p")).toBeVisible();
            await expect(summary).toBeFocused();
            await expectHealthyTemplate(page);
            await summary.press("Space");
            await expect(details).not.toHaveAttribute("open", "");
            await expect(details.locator("p")).toBeHidden();
            await expect(summary).toBeFocused();
          });

          test("link hub keeps raised links readable and contained at 320px", async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await openTemplate(page, "link-hub");
            const links = page.locator(".special-content main ul a");
            await expect(links).toHaveCount(6);
            for (const link of await links.all()) {
              const bounds = await link.boundingBox();
              expect(bounds!.x).toBeGreaterThanOrEqual(0);
              expect(bounds!.x + bounds!.width).toBeLessThanOrEqual(320);
              expect(bounds!.height).toBeGreaterThanOrEqual(44);
              await expect(link).not.toHaveCSS("box-shadow", "none");
            }
            if (await page.evaluate(() => matchMedia("(hover: hover)").matches)) {
              const first = links.first();
              const resting = await first.evaluate((node) => getComputedStyle(node).boxShadow);
              await first.hover();
              await expect(first).not.toHaveCSS("box-shadow", resting);
              const hovering = await first.evaluate((node) => getComputedStyle(node).boxShadow);
              await page.mouse.down();
              try {
                await expect(first).not.toHaveCSS("box-shadow", hovering);
              } finally {
                await page.mouse.move(0, 0);
                await page.mouse.up();
              }
            }
            await expectHealthyTemplate(page);
          });
          TS
      - name: Reproduce both CMS editor jumps on the unchanged source
        working-directory: docs
        run: |
          set +e
          npm run test:browser -- tests/template-states.spec.ts --project=desktop-light --grep '^CMS editing' --reporter=json > "$RUNNER_TEMP/cms-before.json"
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'],'cms-before.json').read_text()
          report=json.loads(raw[raw.index('{'):])
          assert report['stats']['unexpected']==2, report['stats']
          assert not report.get('errors'), report.get('errors')
          print('Both CMS editor-jump regressions reproduced:', report['stats'])
          PY
      - name: Keep the editor stable until the user explicitly changes filters or selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('registry/src/blocks/templates/cms-template.tsx')
          text=path.read_text()
          def replace(before,after):
              global text
              assert text.count(before)==1, before
              text=text.replace(before,after,1)
          replace('function getDisplayPostTitle(post: Post) {', '''function getFilteredPosts(posts: Post[], query: string, statusFilter: StatusFilter) {
            const normalizedQuery = query.trim().toLowerCase();
            return posts.filter((post) => {
              const matchesStatus = statusFilter === "all" || post.status === statusFilter;
              return matchesStatus && (post.title + " " + post.summary).toLowerCase().includes(normalizedQuery);
            });
          }

          function getDisplayPostTitle(post: Post) {''')
          start=text.index('  const normalizedQuery = query.trim().toLowerCase();', text.index('export default function CmsTemplate()'))
          end=text.index('  const updateSelectedPost =',start)
          text=text[:start]+'''  const filteredPosts = getFilteredPosts(posts, query, statusFilter);
            const selectedPost = posts.find((post) => post.id === selectedId);

            const changeFilters = (nextQuery: string, nextStatus: StatusFilter) => {
              const matches = getFilteredPosts(posts, nextQuery, nextStatus);
              setQuery(nextQuery);
              setStatusFilter(nextStatus);
              setSelectedId(resolveSelectedPostId(matches, selectedId));
            };

            const clearFilters = () => changeFilters("", "all");

          '''+text[end:]
          text=text.replace('resolvedSelectedId','selectedId')
          replace('function PostEditorPane({\n  onSubmit,', 'function PostEditorPane({\n  hiddenByFilters,\n  onClearFilters,\n  onSubmit,')
          replace('  onSubmit: React.FormEventHandler<HTMLFormElement>;', '  hiddenByFilters: boolean;\n  onClearFilters: () => void;\n  onSubmit: React.FormEventHandler<HTMLFormElement>;')
          replace('      <div className="grid flex-1 content-start gap-5 p-4 sm:p-5">', '''      {hiddenByFilters ? (
                  <div className="border-b-2 border-border px-4 py-3 text-sm">
                    <p role="status">This post no longer matches the current filters. Your edits are still here.</p>
                    <Button type="button" variant="link" size="sm" className="mt-1 px-0" onClick={onClearFilters}>
                      Clear filters
                    </Button>
                  </div>
                ) : null}

                <div className="grid flex-1 content-start gap-5 p-4 sm:p-5">''')
          replace('onChange={(event) => setQuery(event.target.value)}', 'onChange={(event) => changeFilters(event.target.value, statusFilter)}')
          replace('onClick={() => setStatusFilter(tab.value)}', 'onClick={() => changeFilters(query, tab.value)}')
          replace('              <PostEditorPane\n                post={selectedPost}', '              <PostEditorPane\n                hiddenByFilters={!filteredPosts.some((post) => post.id === selectedId)}\n                onClearFilters={clearFilters}\n                post={selectedPost}')
          path.write_text(text)
          PY
      - name: Regenerate and verify the fixed source
        run: |
          npm run format --prefix registry
          npm run lint --prefix registry
          npm run typecheck --prefix registry
          npm run build --prefix registry
          npm run registry:validate --prefix registry
          npm run registry:check --prefix registry
          npm run format --prefix docs
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs > "$RUNNER_TEMP/template-after-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/template-after-build.log"; exit 1; }
          npm run check:budget --prefix docs
          npm test --prefix docs
      - name: Check all four template families in light and dark and retain state screenshots
        working-directory: docs
        run: |
          cat > .template-review.config.ts <<'TS'
          import { defineConfig } from "@playwright/test";
          import base from "./playwright.config";
          export default defineConfig({
            ...base,
            use: { ...base.use, screenshot: "on" },
            outputDir: `${process.env.RUNNER_TEMP}/template-state-captures`,
          });
          TS
          npx playwright test tests/template-states.spec.ts tests/ui-polish.spec.ts --config=.template-review.config.ts
          rm .template-review.config.ts
      - name: Install and build the CMS in fresh consumers
        run: |
          npm run consumer:verify --prefix registry -- vite --item=cms-template
          npm run consumer:verify --prefix registry -- next --item=cms-template
      - name: Update the audit record and prepare the verified change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> docs/visual-audit.md <<'MD'

          ## Follow-up: template interaction states

          Baseline `4b10d2f` passed both normal Verify jobs (run 35424190133), including production checks.
          The focused follow-up reproduced two CMS defects before changing the source: editing a matching title removed the editor, and changing a draft to published selected a different post before Save.
          Selection now changes only when the user changes filters or selects a row; editing and saving keep the same post. A short inline notice explains when the edited post no longer matches the filters and offers Clear filters.
          This also removes the selection-synchronization effect and the memoized filtering block.

          Focused browser checks cover all four template families: CMS filtered editing, status changes and empty-state recovery; Blog empty-result keyboard recovery; Portfolio native details keyboard behavior; Link Hub 320px layout and raised press states. Both configured light/desktop and dark/mobile projects are checked, including axe on the resulting template content. Pointer-hover assertions only apply when the browser supports hover.
          The installed CMS source is checked in fresh Next.js and Vite consumers.

          These are interaction, layout and accessibility results, not a claim that every captured pixel was visually inspected. The image viewer was unavailable in this follow-up. The remaining full visual sign-off is still pending.
          MD
          rm .github/workflows/template-review-once.yml
          git add registry docs .github/workflows/template-review-once.yml
          git diff --cached --check
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/template-publication"
          git diff --cached > "$RUNNER_TEMP/template-publication/changes.patch"
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(endpoint,payload=None):
              req=urllib.request.Request(base+endpoint,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA']
          assert api('/git/ref/heads/main')['object']['sha']==parent, 'main moved; no publication'
          entries=[]
          for line in subprocess.check_output(['git','diff','--cached','--name-status','--no-renames'],text=True).splitlines():
              status,name=line.split('\t',1)
              entry={'path':name,'mode':'100644','type':'blob'}
              if status=='D':entry['sha']=None
              else:entry['content']=Path(name).read_text()
              entries.append(entry)
          tree=api('/git/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          commit=api('/git/commits',{'message':'fix: keep CMS edits stable across filters and cover template states','tree':tree['sha'],'parents':[parent]})
          result={'prepared_commit':commit['sha'],'expected_main':parent}
          Path(os.environ['RUNNER_TEMP'],'template-publication','commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: Preserve diagnostic evidence and prepared commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: template-state-review
          path: |
            ${{ runner.temp }}/cms-before.json
            ${{ runner.temp }}/template-publication
            ${{ runner.temp }}/template-state-captures
            ${{ runner.temp }}/template-*-build.log
            docs/test-results
            docs/playwright-report
          retention-days: 3
          if-no-files-found: error
