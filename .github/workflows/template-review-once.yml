name: Finalize template state review

on:
  push:
    branches: [main]
    paths: [.github/workflows/template-review-once.yml]

permissions:
  contents: write

concurrency:
  group: template-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install verification dependencies
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          cd docs
          npx playwright install --with-deps chromium
      - name: Restore the source and tests already exercised in run 35425248694
        run: |
          python3 - <<'PY'
          import os,subprocess,textwrap
          from pathlib import Path
          previous=subprocess.check_output(['git','show','148933306f705d808049418523be8dae0cae0230:.github/workflows/template-review-once.yml'],text=True)
          for title,filename in [
              ('Add focused template state regressions','template-tests.sh'),
              ('Keep the editor stable until the user explicitly changes filters or selection','template-source.sh'),
          ]:
              prefix='      - name: '+title+'\n        run: |\n'
              assert previous.count(prefix)==1
              script=previous.split(prefix,1)[1].split('\n      - name:',1)[0]
              Path(os.environ['RUNNER_TEMP'],filename).write_text(textwrap.dedent(script)+'\n')
          PY
          bash "$RUNNER_TEMP/template-tests.sh"
          bash "$RUNNER_TEMP/template-source.sh"
      - name: Regenerate and verify the fixed source
        run: |
          npm run format --prefix registry
          npm run lint --prefix registry
          npm run typecheck --prefix registry
          npm run build --prefix registry
          npm run registry:validate --prefix registry
          npm run registry:check --prefix registry
          npm run format --prefix docs
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs > "$RUNNER_TEMP/template-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/template-build.log"; exit 1; }
          npm run check:budget --prefix docs
          npm test --prefix docs
      - name: Verify all four template families and existing layout regressions
        working-directory: docs
        run: |
          cat > .template-review.config.ts <<'TS'
          import { defineConfig } from "@playwright/test";
          import base from "./playwright.config";
          export default defineConfig({
            ...base,
            use: { ...base.use, screenshot: "on" },
            outputDir: `${process.env.RUNNER_TEMP}/template-state-captures`,
          });
          TS
          npx playwright test tests/template-states.spec.ts tests/ui-polish.spec.ts --config=.template-review.config.ts
          rm .template-review.config.ts
      - name: Verify the CMS page in Next.js and all supported Vite components
        run: |
          npm run consumer:verify --prefix registry -- next --item=cms-template
          npm run consumer:verify --prefix registry -- vite
      - name: Record the verified scope and prepare the publication commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> docs/visual-audit.md <<'MD'

          ## Follow-up: template interaction states

          Baseline `4b10d2f` passed both normal Verify jobs (run 35424190133), including production checks.
          Run 35425248694 reproduced two CMS defects before changing the source: editing a matching title removed the editor, and changing a draft to published selected a different post before Save. Its 32 focused browser checks passed after the fix.
          Selection now changes only when the user changes filters or selects a row; editing and saving keep the same post. A short inline notice explains when the edited post no longer matches the filters and offers Clear filters.
          This also removes the selection-synchronization effect and the memoized filtering block.

          Focused browser checks cover all four template families: CMS filtered editing, status changes and empty-state recovery; Blog empty-result keyboard recovery; Portfolio native details keyboard behavior; Link Hub 320px layout and raised press states. Both configured light/desktop and dark/mobile projects are checked, including axe on the resulting template content. Pointer-hover assertions only apply when the browser supports hover. Test route names use the existing catalog slug type.
          The CMS registry item includes `app/cms/page.tsx`, so its fresh-consumer installation is checked in Next.js. Vite verification covers all items supported by the existing consumer harness; no Vite routing support was added or implied for template pages.

          These are interaction, layout and accessibility results, not a claim that every captured pixel was visually inspected. The image viewer was unavailable in this follow-up. The remaining full visual sign-off is still pending.
          MD
          rm .github/workflows/template-review-once.yml
          git add registry docs .github/workflows/template-review-once.yml
          git diff --cached --check
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/template-publication"
          git diff --cached > "$RUNNER_TEMP/template-publication/changes.patch"
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(endpoint,payload=None):
              req=urllib.request.Request(base+endpoint,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA']
          assert api('/git/ref/heads/main')['object']['sha']==parent, 'main moved; no publication'
          entries=[]
          for line in subprocess.check_output(['git','diff','--cached','--name-status','--no-renames'],text=True).splitlines():
              status,name=line.split('\t',1)
              entry={'path':name,'mode':'100644','type':'blob'}
              if status=='D':entry['sha']=None
              else:entry['content']=Path(name).read_text()
              entries.append(entry)
          tree=api('/git/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          commit=api('/git/commits',{'message':'fix: keep CMS edits stable across filters and cover template states','tree':tree['sha'],'parents':[parent]})
          result={'prepared_commit':commit['sha'],'expected_main':parent}
          Path(os.environ['RUNNER_TEMP'],'template-publication','commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: template-state-publication
          path: |
            ${{ runner.temp }}/template-publication
            ${{ runner.temp }}/template-state-captures
            ${{ runner.temp }}/template-build.log
            docs/test-results
            docs/playwright-report
          retention-days: 3
          if-no-files-found: error
