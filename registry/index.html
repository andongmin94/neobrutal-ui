<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neobrutal-ui registry</title>
    <style>
      :root {
        --background: #f5f4f0;
        --surface: #fff;
        --foreground: #292b29;
        --main: #292b29;
        --main-foreground: #f5f4f0;
        color-scheme: light;
        color: var(--foreground);
        background: var(--background);
        font-family: Arial, Helvetica, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #181a19;
          --surface: #1f1f1f;
          --foreground: #e6e6e6;
          --main: #e5e2d9;
          --main-foreground: #181a19;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        border: 3px solid #111;
        background: var(--surface);
        box-shadow: 8px 8px 0 #111;
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        line-height: 1.6;
        font-weight: 700;
      }

      a {
        display: inline-block;
        margin: 10px 10px 0 0;
        border: 2px solid #111;
        color: var(--main-foreground);
        background: var(--main);
        box-shadow: 4px 4px 0 #111;
        padding: 10px 14px;
        font-weight: 900;
        text-decoration: none;
        transition:
          transform 150ms ease,
          box-shadow 150ms ease;
      }

      a:hover {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 #111;
      }

      a:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }

      a:focus-visible {
        outline: 3px solid var(--foreground);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>neobrutal-ui</h1>
      <p>Modern neobrutalist registry items for shadcn/ui.</p>
      <a href="/r/registry.json">Registry</a>
      <a href="/r/button.json">Button</a>
      <a href="/r/theme-mono.json">Mono Style</a>
    </main>
  </body>
</html>
